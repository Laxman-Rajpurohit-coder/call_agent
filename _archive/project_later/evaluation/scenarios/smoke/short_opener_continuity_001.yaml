id: short_opener_continuity_001
suite: smoke
language: en
category: tts_continuity
transport: direct_audiosocket
caller_goal: short_opener_continuity_regression_test
description: "Verify short conversational openers ('Understood.', 'Got it.') are attached to subsequent clauses without mid-speech queue starvation"

turns:
  - audio_file: "evaluation/audio/synthetic/caller_no_001.wav"

input:
  trigger: caller_says_no
  expected_text: "Understood. How can I assist you today?"

expected:
  sentence_chunks:
    max_count: 1
  required_text:
    - "Understood"
    - "assist"
  forbidden:
    - "isolated_short_opener_chunk"
    - "queue_underflow"

required_facts:
  - "Understood"
  - "assist"

forbidden_facts:
  - "queue_underflow"

audio_gates:
  max_unexpected_gap_ms: 250
  max_queue_underflow_count: 0
  max_duplicate_chunk_count: 0
  max_mid_sentence_cut_count: 0
  max_chunk_count: 1

prosody_gates:
  max_pitch_reset_at_boundary: 0
  max_internal_gap_ms: 250

expected_tools: []

success_conditions:
  - stt_not_empty
  - required_facts_present
  - zero_playback_underruns
  - continuity_score_pass
