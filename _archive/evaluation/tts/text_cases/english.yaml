  # Long multi-sentence responses (15 cases)
  - id: eng_long_001
    text: "The foundation is dedicated to improving community wellbeing across Rajasthan. We focus on educational scholarships for underprivileged children, essential medical aid for families, and vocational training for young adults."
    category: long_multisentence
    language: en
    expected_entities: ["Rajasthan", "scholarships", "medical aid", "vocational training"]

  - id: eng_long_002
    text: "Our administrative office operates six days a week from Monday through Saturday. We are open from 9:00 AM to 5:00 PM, and our staff is always ready to assist visitors in person."
    category: long_multisentence
    language: en
    expected_entities: ["Monday", "Saturday", "9:00 AM", "5:00 PM"]

  - id: eng_long_003
    text: "To become a volunteer, you can submit your details online or visit our Balotra office. Our volunteer coordinator will reach out within two business days to discuss current opportunities."
    category: long_multisentence
    language: en
    expected_entities: ["Balotra"]

  - id: eng_long_004
    text: "Donations support critical welfare programs directly. You can contribute via our secure online donation portal, bank transfer, or by visiting our reception desk in Balotra."
    category: long_multisentence
    language: en
    expected_entities: ["Balotra"]

  - id: eng_long_005
    text: "We organize monthly medical camps where experienced doctors provide free health consultations, basic diagnostic tests, and necessary prescription medications to community members."
    category: long_multisentence
    language: en
    expected_entities: ["medical camps", "consultations"]

  - id: eng_long_006
    text: "Students seeking financial aid can apply through our annual educational support program. Applications require school enrollment verification, academic records, and family income details."
    category: long_multisentence
    language: en
    expected_entities: ["educational support program"]

  - id: eng_long_007
    text: "Our directors, Sanjay Gahlot and Paras Mal Gahlot, oversee the foundation's strategic initiatives. Their vision guides our community welfare and social outreach efforts."
    category: long_multisentence
    language: en
    expected_entities: ["Sanjay Gahlot", "Paras Mal Gahlot"]

  - id: eng_long_008
    text: "If you require emergency assistance, please contact the local emergency services immediately. For general community support, our team is available during standard office hours."
    category: long_multisentence
    language: en
    expected_entities: []

  - id: eng_long_009
    text: "We regularly update our community board with upcoming workshops, educational seminars, and health drives. All residents of Balotra and neighboring areas are welcome to attend."
    category: long_multisentence
    language: en
    expected_entities: ["Balotra"]

  - id: eng_long_010
    text: "Thank you for reaching out to us today. If you need any further assistance regarding our programs, please do not hesitate to contact our office directly."
    category: long_multisentence
    language: en
    expected_entities: []

  - id: eng_long_011
    text: "We believe that accessible education creates lasting social change. Through community partnerships, we sponsor school fees and distribute textbooks to deserving students."
    category: long_multisentence
    language: en
    expected_entities: []

  - id: eng_long_012
    text: "Our healthcare initiatives include maternal health awareness, pediatric nutrition drives, and vision screening camps organized throughout the year."
    category: long_multisentence
    language: en
    expected_entities: ["maternal health", "vision screening"]

  - id: eng_long_013
    text: "Please keep your reference number handy when following up on an application. This helps our administrative staff retrieve your records quickly."
    category: long_multisentence
    language: en
    expected_entities: []

  - id: eng_long_014
    text: "The foundation welcomes partnerships with local institutions and non-profit organizations. Together, we can expand the reach of our community assistance programs."
