id: opening_hours_001
suite: smoke
language: en
category: normal
transport: direct_audiosocket
caller_goal: opening_hours
description: "Batch 1 Scenario: What are your opening hours and working days?"

turns:
  - audio_file: "evaluation/audio/synthetic/opening_hours_001.wav"

allowed_facts:
  - "Gandhi Pura"
  - "Balotra"
  - "Barmer"
  - "Rajasthan"

required_facts:
  - "9:00 AM"
  - "5:00 PM"

forbidden_facts:
  - "24 hours"
  - "closed on Saturday"

expected_tools: []

success_conditions:
  - stt_not_empty
  - required_facts_present
  - forbidden_facts_absent
  - agent_audio_generated
