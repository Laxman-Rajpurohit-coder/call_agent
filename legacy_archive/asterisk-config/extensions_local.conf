;-------------------------------- PrivateDial ----------------------------------
; Filename: extensions_local.conf
; This file is an Asterisk configuration file, part of the PrivateDial suite
; It is included by the extensions.conf file.
;

;-------------------------------- globals --------------------------------------
; include file providing dialing texting options used in context globals
;

;-------------------------------- dialing

[globals]
CONTRY_CODE = 46
DIAL_TIMEOUT =,30

;-------------------------------- voice mail

VOICEMAIL_TEMPLATE =,en_US_email
VOICEMAIL_RECGAINDB =,g(12)

;-------------------------------- entries --------------------------------------
; Calls enter the dialplan in one of these entries
;

[dp_entry_call_inout]
exten => 600,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n,Hangup()

exten => 100,1,Goto(dp_entry_call_inout,700,1)

exten => 700,1,Answer()
 same => n,Set(AUDIO_MD5=${MD5(${UNIQUEID})})
 same => n,Set(AUDIO_UUID=${AUDIO_MD5:0:8}-${AUDIO_MD5:8:4}-${AUDIO_MD5:12:4}-${AUDIO_MD5:16:4}-${AUDIO_MD5:20:12})
 same => n,Set(AUDIO_UUID_VAR=${AUDIO_UUID})
 same => n,Set(SUPERFONE_STATUS=FAILED)
 same => n,MixMonitor(${AUDIO_UUID}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}.wav)
 same => n,AudioSocket(${AUDIO_UUID},host.docker.internal:9092)
 same => n,GotoIf($["${SUPERFONE_STATUS}" = "SUCCESS"]?hangup_normal)
 same => n,GotoIf($["${SUPERFONE_STATUS}" = "TRANSFER"]?hangup_normal)
 same => n,Verbose(1, "Superfone AI Gateway failed or disconnected - status=${SUPERFONE_STATUS}")
 same => n,Playback(vm-goodbye)
 same => n,StopMixMonitor()
 same => n,Hangup()
 same => n(hangup_normal),StopMixMonitor()
 same => n,Hangup()

[superfone-handoff]
exten => 800,1,NoOp(Superfone human handoff)
 same => n,Dial(PJSIP/test1000,30)
 same => n,Hangup()


[dp_entry_call_in]

[dp_entry_text_inout]

[dp_entry_text_in]

[dp_entry_answer]
